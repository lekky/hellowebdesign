name: Deploy to FTP

# Runs whenever a PR is merged into main (a merge pushes to main),
# and on direct pushes to main.
on:
  push:
    branches: [main]

# Avoid overlapping deploys if commits land close together.
concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftps          # explicit FTPS (FTP over TLS) on port 21
          # Login already lands in /public_html, so deploy from repo root to "here".
          local-dir: ./
          server-dir: ./
          # Don't ship repo plumbing or docs to the web server.
          # NOTE: setting `exclude` overrides the action's defaults, so the
          # .git globs are repeated here intentionally.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            .gitignore
            README.md
            CLAUDE.md
            .claude/**
